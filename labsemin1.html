<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; text-align: center; }
        header { background: #333; color: white; padding: 15px; }
        header h1 { margin: 0; color: #3498db; }
        nav { background: #e74c3c; padding: 10px; display: none; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; cursor: pointer; }
        .page { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        .active { display: block; }
        
        /* Auth Screen Styles */
        .auth-container { max-width: 380px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .auth-toggle { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .auth-toggle span { font-weight: bold; cursor: pointer; color: #7f8c8d; }
        .auth-toggle .active-tab { color: #3498db; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .auth-box { display: none; }
        .auth-box.active-box { display: block; }

        /* General Forms & Inputs */
        .box { background: white; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-action { background: #3498db; color: white; border: none; padding: 12px; width: 95%; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 4px; margin-top: 10px; }
        .btn-action:hover { background: #2980b9; }

        /* Storefront Layout */
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { max-width: 100%; height: 180px; object-fit: contain; background: #fff; }
        .price { color: #27ae60; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .btn-buy { background: #2c3e50; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .btn-buy:hover { background: #34495e; }

        /* User Profile Row */
        .row { display: flex; justify-content: space-between; max-width: 400px; margin: 10px auto; padding: 12px; background: white; border-bottom: 1px solid #ddd; }
        .btn-logout { background: #c0392b; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <header><h1>E-commerce</h1></header>
    
    <nav id="mainNav">
        <a onclick="showPage('home')">Home</a>
        <a onclick="showPage('user')">User Profile</a>
        <a onclick="showPage('admin')">Admin Panel</a>
    </nav>

    <!-- AUTHENTICATION GATEWAY (LOGIN / SIGNUP) -->
    <div id="authGate" class="auth-container">
        <div class="auth-toggle">
            <span id="tabLogin" class="active-tab" onclick="toggleAuth('login')">Login</span>
            <span id="tabSignup" onclick="toggleAuth('signup')">Sign Up</span>
        </div>

        <!-- Login Panel -->
        <div id="loginBox" class="auth-box active-box">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Registered Email" required>
                <input type="password" id="loginPass" placeholder="Password" required>
                <button type="submit" class="btn-action">Log In</button>
            </form>
        </div>

        <!-- Signup Panel -->
        <div id="signupBox" class="auth-box">
            <h2>Create Account</h2>
            <form id="signupForm">
                <input type="text" id="signName" placeholder="Full Name" required>
                <input type="email" id="signEmail" placeholder="Email Address" required>
                <input type="password" id="signPass" placeholder="Create Password" required>
                <button type="submit" class="btn-action">Sign Up</button>
            </form>
        </div>
    </div>

    <!-- 1. HOME STOREFRONT PAGE -->
    <div id="home" class="page">
        <h2>Available Products</h2>
        <div class="grid" id="productDisplay"></div>
    </div>

    <!-- 2. USER DASHBOARD PAGE -->
    <div id="user" class="page">
        <h2>Customer Profile</h2>
        <div style="font-size: 60px; margin-bottom: 10px;">👤</div>
        <div class="row"><strong>Name:</strong><span id="profName">Guest</span></div>
        <div class="row"><strong>Email:</strong><span id="profEmail">shopper@example.com</span></div>
        <div class="row"><strong>Status:</strong><span style="color:green; font-weight:bold;">Active Session</span></div>
        <button class="btn-logout" onclick="logoutUser()">Log Out Account</button>
    </div>

    <!-- 3. ADMIN PANEL PAGE -->
    <div id="admin" class="page">
        <div class="box">
            <h2>Add New Stock</h2>
            <form id="prodForm">
                <input type="text" id="pName" placeholder="Product Name" required>
                <input type="number" id="pPrice" placeholder="Price (₹)" required>
                <input type="text" id="pImage" placeholder="Image Filename (e.g., iron.jpg)" required>
                <button type="submit" class="btn-action" style="background: #27ae60;">Add to Storefront</button>
            </form>
        </div>
    </div>

    <script>
        const defaultStock = [
            { name: "Premium Iron Box", price: "500", image: "iron.jpg" },
            { name: "Wireless Headphones", price: "1500", image: "headphones.jpg" }
        ];

        // Handles authorization form view toggling
        function toggleAuth(mode) {
            document.getElementById('loginBox').classList.toggle('active-box', mode === 'login');
            document.getElementById('signupBox').classList.toggle('active-box', mode === 'signup');
            document.getElementById('tabLogin').classList.toggle('active-tab', mode === 'login');
            document.getElementById('tabSignup').classList.toggle('active-tab', mode === 'signup');
        }

        // Handle Signup Data Storage
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = {
                name: document.getElementById('signName').value,
                email: document.getElementById('signEmail').value,
                pass: document.getElementById('signPass').value
            };
            localStorage.setItem('registeredUser', JSON.stringify(user));
            alert("Account created successfully! Please log in now.");
            this.reset();
            toggleAuth('login');
        });

        // Handle Login Verification
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const savedUser = JSON.parse(localStorage.getItem('registeredUser'));

            if (savedUser && savedUser.email === email && savedUser.pass === pass) {
                alert("Login Successful!");
                activateStoreSession(savedUser);
            } else if (!savedUser && email === "admin@test.com" && pass === "admin") {
                // Quick fallback admin credentials if no account exists yet
                activateStoreSession({ name: "Default Admin", email: "admin@test.com" });
            } else {
                alert("Invalid Email or Password! Try again or Sign Up.");
            }
        });

        function activateStoreSession(user) {
            document.getElementById('authGate').style.display = 'none';
            document.getElementById('mainNav').style.display = 'block';
            document.getElementById('profName').innerText = user.name;
            document.getElementById('profEmail').innerText = user.email;
            showPage('home');
        }

        function logoutUser() {
            document.getElementById('mainNav').style.display = 'none';
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('authGate').style.display = 'block';
            document.getElementById('loginForm').reset();
            alert("You have logged out securely.");
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(pageId === 'home') displayProducts();
        }

        function displayProducts() {
            let products = JSON.parse(localStorage.getItem('products')) || defaultStock;
            if(!localStorage.getItem('products')) localStorage.setItem('products', JSON.stringify(defaultStock));
            
            const displayArea = document.getElementById('productDisplay');
            displayArea.innerHTML = '';
            
            products.forEach(p => {
                displayArea.innerHTML += `
                    <div class="card">
                        <img src="${p.image}" onerror="this.src='https://placeholder.com'">
                        <h3>${p.name}</h3>
                        <p class="price">₹${p.price}</p>
                        <button class="btn-buy" onclick="alert('Order successfully generated for: ${p.name}')">Buy Now</button>
